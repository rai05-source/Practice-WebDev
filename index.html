<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BudgetWise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

<!-- ================= HEADER ================= -->
<header class="w-full h-16 bg-white shadow-md flex items-center justify-between px-4">

    <!-- Logo -->
    <div class="flex items-center">
        <img class="h-40 w-auto"
            src="images/48f757e5-d5d9-43c1-a6b6-d9f3f1311c10-watermarked-removebg-preview.png"
            alt="logo">
    </div>

    <!-- Burger Button -->
    <button id="menuBtn" class="p-2 rounded-md hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
            fill="none" stroke="black" stroke-width="2"
            viewBox="0 0 24 24">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

</header>


<!-- ================= SIDEBAR ================= -->
<aside id="sidebar"
    class="fixed top-16 right-0 w-64 h-[calc(100vh-4rem)] 
           bg-white shadow-lg p-6 transform translate-x-full
           transition-transform duration-300">

    <ul class="space-y-3">
        <li><a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100">Home</a></li>
        <li><a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100">Budget</a></li>
        <li><a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100">Expenses</a></li>
        <li><a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100">Reports</a></li>
    </ul>

</aside>


<!-- ================= MAIN CONTENT ================= -->
<main class="flex-grow p-6">
    <h1 class="text-2xl font-bold">Dashboard Content</h1>
</main>


<!-- ================= FOOTER ================= -->
<footer class="bg-gray-800 text-white text-center py-4">
    <p>&copy; 2026 BudgetWise. All rights reserved.</p>
</footer>


<!-- ================= SCRIPT ================= -->
<script>
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");

    menuBtn.addEventListener("click", () => {
        sidebar.classList.toggle("translate-x-full");
    });
</script>

</body>
</html>
